<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headcount Manager | Produtividade</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f3f6fa; --bg2: #e9eef5; --card: #ffffff; --sidebar: #101720; --border: #d5dde7;
            --text: #17202a; --text2: #52606d; --muted: #8291a1;
            --blue: #1677c8; --teal: #168f87; --amber: #d88a16; --red: #cf3f3f; --green: #138a4b;
            --orange: #db7420; --purple: #7c4db5; --cyan: #18a4c7;
            --shadow: 0 2px 8px rgba(15,35,55,.07); --shadow-md: 0 10px 28px rgba(15,35,55,.12);
            --radius: 8px; --sw: 238px; --font: 'Inter', system-ui, sans-serif;
            --mono: 'JetBrains Mono', monospace; --transition: 0.15s ease;
        }
        .dark-mode {
            --bg: #0f1119; --bg2: #1a1c2b; --card: #1e2132; --sidebar: #151724; --border: #2d3148;
            --text: #e2e8f0; --text2: #a0aec0; --muted: #718096; --blue: #63b3ed; --teal: #4fd1c5;
            --amber: #f6ad55; --red: #ef4444; --green: #22c55e; --orange: #f59e0b; --purple: #ce93d8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); display: flex; min-height: 100vh; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
        .loading-overlay.show { display: flex; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p { color: #fff; font-family: var(--mono); font-size: 0.9rem; }
        .login-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: #000; }
        .login-overlay.fade-out { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .login-card { width: 400px; max-width: 92%; background: rgba(15,25,60,.55); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 36px 34px; backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
        .login-mark { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px; background: linear-gradient(135deg, #3182ce, #5ec6ff); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 18px; color: #fff; }
        .login-title { color: #fff; font-size: 19px; font-weight: 800; text-align: center; }
        .login-sub { color: rgba(255,255,255,.5); font-size: 12.5px; text-align: center; margin: 5px 0 26px; }
        .login-field { margin-bottom: 14px; }
        .login-field label { color: rgba(255,255,255,.55); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
        .login-field input { width: 100%; padding: 12px 14px; margin-top: 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #fff; font-size: 14.5px; outline: none; }
        .login-btn { width:100%; margin-top:8px; padding:12px; border:0; border-radius:10px; cursor:pointer;
            background:linear-gradient(135deg,#087bc7,#147cff,#10bfe8); color:#fff; font-weight:700; font-size:14px;
            box-shadow:0 0 16px rgba(0,145,255,.25); transition:.2s; }
        .login-btn:hover { transform:translateY(-1px); box-shadow:0 0 22px rgba(0,190,255,.42); }
        .login-error { margin-top: 14px; padding: 10px 12px; border-radius: 9px; background: rgba(214,69,69,.15); border: 1px solid rgba(214,69,69,.4); color: #ffb4b4; font-size: 12.5px; display: none; }
        .login-error.show { display: flex; align-items: center; gap: 8px; }
        .sidebar { width:var(--sw); background:
            radial-gradient(circle at 20% 8%,rgba(0,212,255,.16),transparent 24%),
            radial-gradient(circle at 90% 42%,rgba(0,120,255,.12),transparent 30%),
            linear-gradient(180deg,#08121c 0%,#0d1b28 52%,#09141f 100%);
            color:#dbeeff; border-right:1px solid rgba(54,181,255,.28);
            display:flex; flex-direction:column; padding:16px 0; position:fixed; top:0; left:0; bottom:0;
            z-index:100; box-shadow:8px 0 35px rgba(0,110,210,.13), inset -1px 0 rgba(65,205,255,.08);
            overflow:hidden; }
        .sidebar:before { content:""; position:absolute; height:3px; top:0; left:0; right:0;
            background:linear-gradient(90deg,#00d9ff,#1677ff,#00f0b5,#00d9ff);
            background-size:250% 100%; animation:neonFlow 5s linear infinite;
            box-shadow:0 0 8px #00cfff,0 0 20px rgba(0,180,255,.65); }
        .sidebar:after { content:""; position:absolute; width:180px; height:180px; border-radius:50%;
            left:-90px; bottom:60px; background:rgba(0,205,255,.08); filter:blur(28px); pointer-events:none; }
        @keyframes neonFlow { 0%{background-position:0% 50%} 100%{background-position:250% 50%} }
        .sidebar .sidebar-header { border-bottom-color:rgba(72,170,220,.22); padding-bottom:18px; }
        .sidebar .sidebar-header h2 { color:#f5fbff; letter-spacing:-.4px; text-shadow:0 0 12px rgba(50,190,255,.38); }
        .sidebar .nav-item { color:#9bb6ca; border:1px solid transparent; border-radius:7px; position:relative; }
        .sidebar .nav-item i { width:18px; text-align:center; color:#55bff0; text-shadow:0 0 7px rgba(0,190,255,.5); }
        .sidebar .nav-item:hover { background:rgba(35,155,220,.11); color:#f5fcff; border-color:rgba(54,181,255,.18); box-shadow:0 0 16px rgba(0,150,255,.08); }
        .sidebar .nav-item.active { background:linear-gradient(90deg,rgba(0,160,240,.25),rgba(0,100,210,.32)); color:#fff;
            border-color:rgba(57,195,255,.38); box-shadow:inset 3px 0 #42d8ff,0 0 18px rgba(0,155,255,.13); }
        .sidebar .nav-item.active i { color:#7be6ff; text-shadow:0 0 10px rgba(0,220,255,.85); }
        .sidebar .sidebar-footer { border-top-color:rgba(72,170,220,.20); color:#7895aa; }
        .sidebar .user-info { background:rgba(24,55,76,.45); border:1px solid rgba(58,178,230,.18); box-shadow:inset 0 0 18px rgba(0,130,220,.05); }
        .sidebar .user-avatar { background:linear-gradient(135deg,#087bc5,#12c8e8); box-shadow:0 0 12px rgba(0,190,255,.45); }
        .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .sidebar-header h2 { font-weight: 700; font-size: 1.25rem; }
        .sidebar-nav { flex: 1; padding: 0 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; color: var(--text2); font-weight: 500; font-size: 0.92rem; cursor: pointer; transition: all var(--transition); }
        .nav-item:hover { background: var(--bg2); }
        .nav-item.active { background: var(--blue); color: white; }
        .sidebar-footer { padding: 20px 20px 0; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; background: var(--bg2); padding: 10px; border-radius: 10px; }
        .user-avatar { width: 30px; height: 30px; border-radius: 8px; background: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #fff; }
        .main-content { flex: 1; margin-left: var(--sw); padding: 20px 22px 32px; background:
            radial-gradient(circle at 100% 0%,rgba(22,119,200,.06),transparent 28%),
            var(--bg); display: flex; flex-direction: column; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title h1 { font-weight: 800; font-size: 1.9rem; letter-spacing: -0.7px; }
        .page-title:after { content:"OPERAÇÃO • PRODUTIVIDADE"; display:block; margin-top:4px; font:600 9px var(--mono); color:var(--muted); letter-spacing:1.4px; }
        .prod-selector { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .prod-selector .btn { background: var(--card); color: var(--text2); border: 1px solid var(--border); }
        .prod-selector .btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
        .filter-bar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px; align-items:center; background:var(--card); padding:10px 12px; border-radius:7px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 0.75rem; font-weight: 600; color: var(--text2); }
        .filter-group input, .filter-group select { background: var(--bg2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-family: var(--mono); color: var(--text); font-size: 0.82rem; outline: none; }
        .metric-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: var(--card); padding: 10px 12px; border-radius: 7px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .metric-bar label { font-size: 0.75rem; font-weight: 600; color: var(--text2); }
        .metric-bar select { background: var(--bg2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-family: var(--mono); color: var(--text); font-size: 0.82rem; outline: none; }
        .cards-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .metric-card:before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--blue); }
        .metric-card .metric-label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }
        .metric-card .metric-value { font-family: var(--mono); font-weight: 700; font-size: 1.5rem; margin-top: 4px; }
        .table-outer { border:1px solid #cbd5df; border-radius:7px; overflow:auto; background:var(--card); max-height:62vh; box-shadow:var(--shadow-md); }
        table { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:.70rem; }
        th { position:sticky; top:0; z-index:20; background:#172532; padding:8px 6px; text-align:center; font-weight:700; font-size:.60rem; text-transform:uppercase; color:#d7e4ef; border-bottom:2px solid #1677c8; letter-spacing:.35px; }
        td { padding:6px 6px; text-align:center; border-bottom:1px solid #e4e9ef; font-family:var(--mono); font-weight:600; }
        tbody tr:hover td { background:#f1f7fb; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; background: var(--blue); color: white; display: inline-flex; align-items: center; gap: 6px; }
        .btn.ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Carregando dados…</p>
    </div>

    <!-- Login overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="login-mark">HM</div>
            <div class="login-title">Headcount Manager</div>
            <div class="login-sub">Acesso restrito</div>
            <div class="login-field"><label>Usuário</label><input type="text" id="loginUser" placeholder="Matrícula"></div>
            <div class="login-field"><label>Senha</label><input type="password" id="loginPass" placeholder="Senha"></div>
            <button class="login-btn" id="loginBtn" onclick="tentarLogin()"><span>Entrar</span></button>
            <div class="login-error" id="loginError"><span>⚠️</span><span id="loginErrorText"></span></div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header"><h2>Headcount Manager</h2></div>
        <nav class="sidebar-nav">
            <div class="nav-item" data-page="absenteismo"><i class="fa-solid fa-user-slash"></i> Absenteísmo</div>
            <div class="nav-item active" data-page="produtividade"><i class="fa-solid fa-chart-line"></i> Produtividade</div>
            <div class="nav-item" data-page="bases" id="navBases"><i class="fa-solid fa-database"></i> Bases</div>
            <div class="nav-item" data-page="usuarios" id="navUsuarios"><i class="fa-solid fa-users-gear"></i> Usuários</div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="userInfo" style="display:none;">
                <div class="user-avatar" id="userAvatar">--</div>
                <div style="flex:1"><div id="userName">--</div><div id="userLevel" style="font-size:0.65rem;color:var(--muted);"></div></div>
                <button class="btn ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon"></i><span>Modo Escuro</span></div>
            <div>Desenvolvido por <strong>Pablo Martins Lopes</strong></div>
        </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="main-content">
        <div class="page-header">
            <div class="page-title"><h1>Produtividade</h1></div>
        </div>

        <!-- Seletor de operação -->
        <div class="prod-selector" id="prodSelector">
            <button class="btn active" data-op="RECEBIMENTO" onclick="trocarOperacao('RECEBIMENTO')">RECEBIMENTO</button>
            <button class="btn" data-op="VERTICAL" onclick="trocarOperacao('VERTICAL')">VERTICAL</button>
            <button class="btn" data-op="HORIZONTAL" onclick="trocarOperacao('HORIZONTAL')">HORIZONTAL</button>
            <button class="btn" data-op="SEPARACAO" onclick="trocarOperacao('SEPARACAO')">SEPARAÇÃO</button>
            <button class="btn" data-op="EXPEDICAO" onclick="trocarOperacao('EXPEDICAO')">EXPEDIÇÃO</button>
        </div>

        <!-- Filtros dinâmicos -->
        <div class="filter-bar" id="filtersContainer"></div>

        <!-- Seletor de métrica -->
        <div class="metric-bar" id="metricContainer"></div>

        <!-- Cards -->
        <div class="cards-container" id="cardsContainer"></div>

        <!-- Tabela -->
        <div class="table-outer">
            <div style="max-height:60vh;">
                <table id="tabelaProd">
                    <thead id="theadProd"></thead>
                    <tbody id="tbodyProd"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const sb = supabase.createClient('https://tvrfetjhqxvxorzytpci.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2cmZldGpocXh2eG9yenl0cGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDc5NzksImV4cCI6MjEwMTUyMzk3OX0.Di7fxD4moTBjWlkzlZ2TNpszo4fz96kAzsBY0cialFA');

        let currentUser = null;
        let operacaoAtual = 'RECEBIMENTO';

        const viewConfigs = {
            RECEBIMENTO: {
                table: 'RECEB',
                fixedCols: ['COND_CONF', 'CONFERENTE'],
                dateCol: 'DTA',
                metrics: ['QTD_CARGAS'],
                metricType: 'fixed',
                filters: {
                    turno: 'TURNO',
                    turnoLabel: 'Turno',
                    status: false,
                    searchFields: ['COND_CONF', 'CONFERENTE']
                },
                extraCondition: null
            },
            VERTICAL: {
                table: 'VT_HR',
                fixedCols: ['CODPRODUTIVO', 'PRODUTIVO'],
                dateCol: 'DTA_PROD',
                metrics: ['QTD_PESO', 'QTD_PLT'],
                metricType: 'select',
                filters: {
                    turno: 'TURNO_PROD',
                    turnoLabel: 'Turno',
                    status: false,
                    searchFields: ['CODPRODUTIVO', 'PRODUTIVO']
                },
                extraCondition: { field: 'ATIVIDADE', value: 'MOV. VERTICAL' }
            },
            HORIZONTAL: {
                table: 'VT_HR',
                fixedCols: ['CODPRODUTIVO', 'PRODUTIVO'],
                dateCol: 'DTA_PROD',
                metrics: ['QTD_PESO', 'QTD_PLT'],
                metricType: 'select',
                filters: {
                    turno: 'TURNO_PROD',
                    turnoLabel: 'Turno',
                    status: false,
                    searchFields: ['CODPRODUTIVO', 'PRODUTIVO']
                },
                extraCondition: { field: 'ATIVIDADE', value: 'MOV. HORIZONTAL' }
            },
            SEPARACAO: {
                table: 'PLT_FECH',
                fixedCols: ['CODPRODUTIVO', 'PRODUTIVO', 'LINHASEPAR'],
                dateCol: 'DTA_INI',
                metrics: ['QTD_CARGAS', 'QTD_LOTES', 'QTD_VISITAS', 'QTD_CXS'],
                metricType: 'select',
                filters: {
                    turno: 'TURNO_FAT',
                    turnoLabel: 'Turno Fat',
                    turno2: 'TURNO_PROD',
                    turno2Label: 'Turno Prod',
                    status: true,
                    searchFields: ['CODPRODUTIVO', 'PRODUTIVO']
                },
                extraCondition: { field: 'PLTFECHADO', value: 'SEPARAÇÃO' }
            },
            EXPEDICAO: {
                table: 'PLT_FECH',
                fixedCols: ['CODPRODUTIVO', 'PRODUTIVO', 'LINHASEPAR'],
                dateCol: 'DTA_INI',
                metrics: ['QTD_CARGAS', 'QTD_LOTES', 'QTD_VISITAS', 'QTD_CXS'],
                metricType: 'select',
                filters: {
                    turno: 'TURNO_FAT',
                    turnoLabel: 'Turno Fat',
                    turno2: 'TURNO_PROD',
                    turno2Label: 'Turno Prod',
                    status: true,
                    searchFields: ['CODPRODUTIVO', 'PRODUTIVO']
                },
                extraCondition: { field: 'PLTFECHADO', value: 'CONFERENTE' }
            }
        };

        function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

        function aplicarUI() {
            if (!currentUser) return;
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').textContent = currentUser.nome.split(' ')[0];
            document.getElementById('userAvatar').textContent = currentUser.nome.substring(0,2).toUpperCase();
            const lvl = currentUser.level;
            document.getElementById('userLevel').textContent = lvl===1?'Total':lvl===2?'RH':lvl===3?'Analista':'Visualizador';
            document.getElementById('navBases').style.display = lvl<4?'':'none';
            document.getElementById('navUsuarios').style.display = lvl===1?'':'none';
        }

        async function tentarLogin() {
            const u = document.getElementById('loginUser').value.trim(), p = document.getElementById('loginPass').value;
            if (!u || !p) return alert('Preencha campos.');
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const { data } = await sb.from('USERS').select('*').eq('Matricula', u).limit(1);
                if (!data?.length || String(data[0].Password).trim() !== p.trim()) throw new Error('Credenciais inválidas.');
                currentUser = { matricula: data[0].Matricula, nome: data[0].Nome || data[0].Matricula, level: Number(data[0].Level) || 4 };
                sessionStorage.setItem('hc_user', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').classList.add('fade-out');
                setTimeout(() => document.getElementById('loginOverlay').style.display = 'none', 500);
                aplicarUI();
                inicializarProdutividade();
            } catch (e) { alert(e.message); }
            finally { btn.disabled = false; btn.innerHTML = 'Entrar'; }
        }
        window.tentarLogin = tentarLogin;

        function logout() {
            currentUser = null;
            sessionStorage.removeItem('hc_user');
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('loginOverlay').classList.remove('fade-out');
            document.getElementById('userInfo').style.display = 'none';
        }

        // Navegação lateral
        document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => {
            const page = n.dataset.page;
            if (page === 'absenteismo') {
                window.location.href = 'abs.html';
            } else if (page === 'produtividade') {
                // já está aqui
            } else if (page === 'bases') {
                window.location.href = 'index.html?page=bases';
            } else if (page === 'usuarios') {
                window.location.href = 'index.html?page=usuarios';
            }
        }));

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const d = document.body.classList.contains('dark-mode');
            document.getElementById('themeToggle').innerHTML = d ? '<i class="fa-solid fa-sun"></i><span>Modo Claro</span>' : '<i class="fa-solid fa-moon"></i><span>Modo Escuro</span>';
        });

        function trocarOperacao(op) {
            operacaoAtual = op;
            document.querySelectorAll('.prod-selector .btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.prod-selector .btn[data-op="${op}"]`).classList.add('active');
            construirFiltros();
            construirMetrica();
            carregarDadosProd();
        }
        window.trocarOperacao = trocarOperacao;

        function construirFiltros() {
            const config = viewConfigs[operacaoAtual];
            const container = document.getElementById('filtersContainer');
            let html = `
                <div class="filter-group">
                    <label>De:</label>
                    <input type="date" id="dataInicio" onchange="carregarDadosProd()">
                </div>
                <div class="filter-group">
                    <label>Até:</label>
                    <input type="date" id="dataFim" onchange="carregarDadosProd()">
                </div>
            `;
            if (config.filters.turno) {
                html += `
                <div class="filter-group">
                    <label>${config.filters.turnoLabel || 'Turno'}</label>
                    <select id="turnoFilter" onchange="carregarDadosProd()">
                        <option value="">Todos</option>
                        <option value="1_TURNO">1_TURNO</option>
                        <option value="2_TURNO">2_TURNO</option>
                        <option value="3_TURNO">3_TURNO</option>
                    </select>
                </div>`;
            }
            if (config.filters.turno2) {
                html += `
                <div class="filter-group">
                    <label>${config.filters.turno2Label || 'Turno 2'}</label>
                    <select id="turno2Filter" onchange="carregarDadosProd()">
                        <option value="">Todos</option>
                        <option value="1_TURNO">1_TURNO</option>
                        <option value="2_TURNO">2_TURNO</option>
                        <option value="3_TURNO">3_TURNO</option>
                    </select>
                </div>`;
            }
            if (config.filters.status) {
                html += `
                <div class="filter-group">
                    <label>Status</label>
                    <input type="text" id="statusFilter" placeholder="Status" oninput="carregarDadosProd()">
                </div>`;
            }
            html += `
                <div class="filter-group">
                    <label>Busca</label>
                    <input type="text" id="buscaInput" placeholder="Busca..." oninput="carregarDadosProd()" style="min-width:200px;">
                </div>
            `;
            container.innerHTML = html;

            // Definir datas padrão (hoje)
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataInicio').value = hoje;
            document.getElementById('dataFim').value = hoje;
        }

        function construirMetrica() {
            const config = viewConfigs[operacaoAtual];
            const container = document.getElementById('metricContainer');
            if (config.metricType === 'fixed') {
                container.innerHTML = `<label>Métrica:</label><span style="font-family:var(--mono);">${config.metrics[0]}</span>`;
            } else {
                const options = config.metrics.map(m => `<option value="${m}">${m}</option>`).join('');
                container.innerHTML = `<label>Métrica:</label><select id="metricSelect" onchange="carregarDadosProd()">${options}</select>`;
            }
        }

        async function carregarDadosProd() {
            if (!currentUser) return;
            const config = viewConfigs[operacaoAtual];
            const dateCol = config.dateCol;
            const startDate = document.getElementById('dataInicio').value;
            const endDate = document.getElementById('dataFim').value;

            if (!startDate || !endDate) {
                const hoje = new Date().toISOString().split('T')[0];
                document.getElementById('dataInicio').value = hoje;
                document.getElementById('dataFim').value = hoje;
                return carregarDadosProd();
            }

            const turnoFilter = config.filters.turno ? document.getElementById('turnoFilter')?.value : null;
            const turno2Filter = config.filters.turno2 ? document.getElementById('turno2Filter')?.value : null;
            const statusFilter = config.filters.status ? document.getElementById('statusFilter')?.value : null;
            const busca = document.getElementById('buscaInput')?.value.trim().toLowerCase() || '';
            const metric = config.metricType === 'fixed' ? config.metrics[0] : document.getElementById('metricSelect')?.value;

            showLoading();
            try {
                let query = sb.from(config.table).select('*')
                    .gte(dateCol, startDate)
                    .lte(dateCol, endDate);

                if (config.extraCondition) {
                    query = query.eq(config.extraCondition.field, config.extraCondition.value);
                }
                if (turnoFilter && turnoFilter !== '') {
                    query = query.eq(config.filters.turno, turnoFilter);
                }
                if (turno2Filter && turno2Filter !== '') {
                    query = query.eq(config.filters.turno2, turno2Filter);
                }
                if (statusFilter && statusFilter.trim() !== '') {
                    query = query.eq('STATUS', statusFilter.trim());
                }
                if (busca) {
                    const orParts = config.filters.searchFields.map(f => `${f}.ilike.%${busca}%`).join(',');
                    query = query.or(orParts);
                }

                const allData = await fetchAll(query);
                const pivot = buildPivot(allData, config.fixedCols, dateCol, metric);
                renderTable(pivot, config.fixedCols);
                renderCards(pivot, metric);
            } catch (e) {
                console.error(e);
                document.getElementById('tbodyProd').innerHTML = `<tr><td colspan="10">Erro: ${e.message}</td></tr>`;
                document.getElementById('cardsContainer').innerHTML = '';
            } finally {
                hideLoading();
            }
        }
        window.carregarDadosProd = carregarDadosProd;

        async function fetchAll(query) {
            let all = [];
            let from = 0;
            const size = 1000;
            while (true) {
                const { data, error } = await query.range(from, from + size - 1);
                if (error) throw error;
                if (data && data.length) {
                    all = all.concat(data);
                }
                if (!data || data.length < size) break;
                from += size;
            }
            return all;
        }

        function buildPivot(records, fixedCols, dateCol, metric) {
            const rowsMap = new Map();
            const allDates = new Set();

            for (const rec of records) {
                const dateValue = rec[dateCol];
                if (!dateValue) continue;
                const key = fixedCols.map(c => String(rec[c] ?? '')).join('|');
                if (!rowsMap.has(key)) {
                    const row = {};
                    fixedCols.forEach(c => row[c] = rec[c] ?? '');
                    row._dates = new Map();
                    rowsMap.set(key, row);
                }
                const row = rowsMap.get(key);
                const current = row._dates.get(dateValue) || 0;
                const value = Number(rec[metric]) || 0;
                row._dates.set(dateValue, current + value);
                allDates.add(dateValue);
            }

            const sortedDates = Array.from(allDates).sort();
            const rows = Array.from(rowsMap.values()).map(row => {
                const result = {};
                fixedCols.forEach(c => result[c] = row[c]);
                result._dates = {};
                for (const date of sortedDates) {
                    result._dates[date] = row._dates.get(date) || 0;
                }
                return result;
            });
            return { rows, dates: sortedDates };
        }

        function renderTable(pivot, fixedCols) {
            const { rows, dates } = pivot;
            let thead = '<tr>';
            fixedCols.forEach(c => thead += `<th>${c}</th>`);
            dates.forEach(d => {
                const parts = d.split('-');
                thead += `<th>${parts[2]}/${parts[1]}</th>`;
            });
            thead += '</tr>';
            document.getElementById('theadProd').innerHTML = thead;

            let tbody = '';
            rows.forEach(row => {
                tbody += '<tr>';
                fixedCols.forEach(c => tbody += `<td>${row[c]}</td>`);
                dates.forEach(d => {
                    const val = row._dates[d];
                    // Exibir valor inteiro, sem casas decimais
                    tbody += `<td>${val !== undefined ? Math.round(val) : ''}</td>`;
                });
                tbody += '</tr>';
            });
            document.getElementById('tbodyProd').innerHTML = tbody || `<tr><td colspan="${fixedCols.length + dates.length}">Nenhum dado encontrado.</td></tr>`;
        }

        function renderCards(pivot, metric) {
            const { rows, dates } = pivot;
            let total = 0;
            let count = 0;
            let min = Infinity;
            let max = -Infinity;

            rows.forEach(row => {
                dates.forEach(d => {
                    const val = row._dates[d];
                    if (val !== undefined && val !== 0) {
                        total += val;
                        count++;
                        if (val < min) min = val;
                        if (val > max) max = val;
                    }
                });
            });

            const avg = count > 0 ? (total / count) : 0;
            const cards = [
                { label: 'Média', value: Math.round(avg) },
                { label: 'Total', value: Math.round(total) },
                { label: 'Máximo', value: max === -Infinity ? 0 : Math.round(max) },
                { label: 'Mínimo', value: min === Infinity ? 0 : Math.round(min) }
            ];

            document.getElementById('cardsContainer').innerHTML = cards.map(c => `
                <div class="metric-card">
                    <div class="metric-label">${c.label}</div>
                    <div class="metric-value">${c.value}</div>
                </div>
            `).join('');
        }

        function inicializarProdutividade() {
            construirFiltros();
            construirMetrica();
            carregarDadosProd();
        }

        // Restaura sessão
        document.addEventListener('DOMContentLoaded', () => {
            const session = sessionStorage.getItem('hc_user');
            if (session) {
                try {
                    currentUser = JSON.parse(session);
                    aplicarUI();
                    document.getElementById('loginOverlay').style.display = 'none';
                    inicializarProdutividade();
                } catch (e) {
                    sessionStorage.removeItem('hc_user');
                }
            }
        });
    </script>
</body>
</html>
